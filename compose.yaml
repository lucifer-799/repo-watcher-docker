# compose.yaml —— Repo Watcher（Docker 版）
#
# 多平台仓库更新监控工具，基于 MagicCode 的 Repo Watcher（MIT）二次开发的 Docker 版本。
#
# 使用前请先创建数据目录并设置属主（容器以非 root 的 uid 1000 运行）：
#   mkdir -p ./data && sudo chown -R 1000:1000 ./data
#
# 然后：
#   docker compose up -d          # 使用 ghcr.io 公网镜像（默认按下方版本号拉取）
#   或
#   docker compose up -d --build  # 从本仓库源码本地构建
#
# 打开 http://<主机IP>:8080 ，首次访问会引导创建管理员账号。
services:
  repo-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    # 公网镜像（ghcr.io）。默认固定版本，可用环境变量覆盖；也可改成 :latest 追随最新。
    #   固定版本：REPO_WATCHER_VERSION=1.1.3
    #   追随最新：REPO_WATCHER_VERSION=latest
    image: ghcr.io/lucifer-799/repo-watcher-docker:${REPO_WATCHER_VERSION:-1.1.3}
    container_name: repo-watcher
    restart: unless-stopped

    # 宿主端口 → 容器内 8080；用 HOST_PORT 环境变量可改左侧端口，避免与本机其它服务冲突
    ports:
      - "${HOST_PORT:-8080}:8080"

    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      # SQLite 数据库落盘位置（对应下方 ./data 卷）
      - DB_PATH=/app/data/repo-watcher.db
      # 前端构建产物目录（镜像内已内置，一般无需修改）
      - WWW_DIR=/app/www

      # 凭据加密密钥 / JWT 签名密钥（建议显式提供并妥善保管；未提供时首次启动自动生成到容器内 etc/app.env）
      # - CONFIG_ENC_KEY=<32 字节以上随机串>
      # - JWT_SECRET=<32 字节以上随机串>

      # ⚠️ 安全：TCP 监听模式下必须为 0；设为 1 时服务会直接拒绝启动
      #    （防止有人伪造网关身份头 X-Trim-Isadmin 提权为管理员）
      - TRUST_GATEWAY_HEADERS=0

      # 是否信任反向代理提供的客户端 IP 头（x-real-ip / X-Forwarded-For），用于登录失败限流分桶：
      #   true  —— 部署在 NPM / Caddy / Nginx 之后（代理会覆盖/追加这些头）
      #   false —— 端口直接对外、无反向代理；此时按 TCP 连接真实对端地址分桶，伪造这些头无效
      # 默认 true（适合常见的「反代前置」部署）。若你把 8080 直接暴露公网，请改为 false。
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-true}

    volumes:
      # 数据卷：SQLite 数据库持久化（迁移时把既有 repo-watcher.db 放进该目录，属主 1000:1000）
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s