# compose.yaml —— Repo Watcher（Docker 版）
#
# 多平台仓库更新监控工具，基于 MagicCode 的 Repo Watcher（MIT）二次开发的 Docker 版本。
#
# 用法：
#   1) 先建数据目录并设属主（容器以非 root 的 uid 1000 运行，属主不匹配会写不进库）：
#        mkdir -p ./data && sudo chown -R 1000:1000 ./data
#   2) 启动：
#        docker compose up -d
#   3) 打开 http://<主机IP>:8080 ，首次访问会引导创建管理员账号。
#
# 想固定版本（可复现/稳定）时，把下面 image 的 :latest 改成具体版本，例如 :1.1.4。
# 需要从源码本地构建请看「开发」章节（使用 compose.build.yaml）。
services:
  repo-watcher:
    image: ghcr.io/lucifer-799/repo-watcher-docker:latest   # 固定版本改成 :1.1.4
    container_name: repo-watcher
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      # 安全：TCP 监听模式下必须为 0（为 1 时服务会拒绝启动，防止伪造网关身份头提权）
      - TRUST_GATEWAY_HEADERS=0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s